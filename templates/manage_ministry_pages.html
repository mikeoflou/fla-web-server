{% extends "base.html" %}

{% block content %}
<div style="padding: 20px; max-width: 960px; margin: 30px auto;">
    <h2 style="text-align: center; margin-bottom: 8px;">Manage Ministry Pages</h2>
    <p style="text-align: center; color: #9adfaa; margin-bottom: 24px;">Quick access to edit the Youth and Senior Adult ministry pages.</p>

    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
        {% for page in ministry_pages %}
        <div style="background:#000; border:2px solid #2ecc71; border-radius:10px; padding:18px; display:flex; flex-direction:column; gap:12px;">
            <div>
                <h3 style="margin:0 0 6px 0; color:#2ecc71;">{{ page.icon }} {{ page.title }}</h3>
                <p style="margin:0; color:#cfead4; line-height:1.6;">{{ page.preview }}</p>
            </div>

            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:auto;">
                <a href="{{ url_for('manage_custom_page', slug=page.slug) }}" style="display:inline-block; background:#1f6f3a; color:#fff; text-decoration:none; border-radius:6px; padding:10px 14px; font-weight:bold;">Edit Page</a>
                <a href="{{ url_for(page.public_endpoint) }}" style="display:inline-block; background:#222; color:#2ecc71; text-decoration:none; border:1px solid #2ecc71; border-radius:6px; padding:10px 14px; font-weight:bold;">View Public Page</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
