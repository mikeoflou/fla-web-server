{% extends "base.html" %}

{% block content %}
<div style="padding: 20px; max-width: 500px; margin: 40px auto;">
    <h2 style="text-align: center;">Change Password</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div style="background: #102e17; border: 1px solid #2ecc71; border-radius: 6px; padding: 10px; margin-bottom: 15px; color: #b8f5c9;">
                {% for message in messages %}
                    <div>{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('change_password') }}" style="background: #000000; border: 2px solid #2ecc71; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
        <div>
            <label><strong>Current Password</strong></label><br>
            <input type="password" name="current_password" required style="width: 100%; padding: 8px; border: 1px solid #2ecc71; border-radius: 4px; background: #000000; color: #2ecc71;">
        </div>

        <div>
            <label><strong>New Password</strong></label><br>
            <input type="password" name="new_password" required minlength="6" style="width: 100%; padding: 8px; border: 1px solid #2ecc71; border-radius: 4px; background: #000000; color: #2ecc71;">
        </div>

        <div>
            <label><strong>Confirm New Password</strong></label><br>
            <input type="password" name="confirm_password" required minlength="6" style="width: 100%; padding: 8px; border: 1px solid #2ecc71; border-radius: 4px; background: #000000; color: #2ecc71;">
        </div>

        <button type="submit" style="background: #1f6f3a; color: #ffffff; border: none; border-radius: 4px; padding: 10px 14px; font-weight: bold; cursor: pointer;">Update Password</button>
    </form>
</div>
{% endblock %}
