{% extends "base.html" %}
{% block content %}
<div style="padding: 20px; max-width: 900px; margin: 0 auto; margin-top: 30px;">
    <h1 style="color: #2ecc71; text-align: center; margin-bottom: 30px;">Volunteer Opportunities</h1>

    {% if volunteers %}
        <div style="display: flex; flex-direction: column; gap: 20px;">
            {% for volunteer in volunteers %}
            <div style="border: 2px solid #2ecc71; border-radius: 8px; padding: 20px; background: #000000;">
                <p style="color: #e0e0e0; line-height: 1.6; white-space: pre-wrap;">{{ volunteer.description }}</p>
                <small style="color: #888;">Posted on {{ volunteer.date_posted }}</small>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <div style="text-align: center; padding: 40px; color: #888;">
            <p>No volunteer opportunities at this time.</p>
        </div>
    {% endif %}
</div>
{% endblock %}
