<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EHBC Newsletter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .sidebar {
    height: 100%;
    width: 0; 
    position: fixed;   
    z-index: 9999;     
    top: 0; 
    left: 0;           
    background-color: white; 
    border-right: 2px solid black; 
    
    /* This is the "Lock" that stops the links from leaking out */
    overflow-x: hidden !important; 
    visibility: hidden; 
    
    transition: 0.5s; 
    padding-top: 60px;
}

.sidebar a {
    padding: 10px 32px;
    text-decoration: none;
    font-size: 22px;
    color: black !important;
    display: block;
    font-weight: bold;
    white-space: nowrap; /* Prevents links from stacking weirdly */
}

.openbtn {
    font-size: 20px;
    cursor: pointer;
    background-color: white;
    color: black;
    padding: 10px 15px;
    border: 2px solid black;
    font-weight: bold;
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1000;
}

body, p, h1, h2 {
    font-weight: bold !important;
    text-align: center;
}

#main {
    transition: margin-left .5s;
    padding-top: 80px; /* Space for the button */
}
    </style>
<head>
    
    <meta property="og:image" content="https://www.ehbcnewsletterjeff.org/static/images/church_exterior.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="EHBC Church Exterior">
    
    <meta property="og:title" content="EHBC Newsletter">
    <meta property="og:description" content="Join us for worship every Sunday at 9:00 AM, Sunday School 10:00 AM, and Worship Service again at 11:00 AM.">

    <style>
        .church-banner {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }
    </style>  

</head>
<body>

  <div id="mySidebar" class="sidebar">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <a href="/">HOME</a>
    <a href="/chris">Scripture and Outline</a>
    <a href="/jason">Order of Worship</a>
    <a href="/mens_ministry">MENS MINISTRY</a>
    <a href="/womens-ministry">WOMENS MINISTRY</a>
    <a href="/announcements">ANNOUNCEMENTS</a>
    <a href="/senior-adults">SENIOR ADULTS</a>
    {% if show_menu %}
        <a href="/volunteers?view=ehbc-members-only">VOLUNTEERS</a>
    {% endif %}
    <a href="/youth-ministry">YOUTH MINISTRY</a>
</div>

<div id="main">
    <button class="openbtn" onclick="openNav()">☰ MENU</button>
    {% block content %}{% endblock %}
</div>

<script>
    function openNav() {
        document.getElementById("mySidebar").style.width = "250px";
        document.getElementById("mySidebar").style.visibility = "visible"; // SHOWS THE LINKS
        document.getElementById("main").style.marginLeft = "250px";
    }

    function closeNav() {
        document.getElementById("mySidebar").style.width = "0";
        document.getElementById("mySidebar").style.visibility = "hidden"; // HIDES THE LINKS
        document.getElementById("main").style.marginLeft = "0";
    }
</script>
</body>
</html>
