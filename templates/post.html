{% extends "base.html" %}

{% block content %}
    <div style="text-align: center; margin-top: 50px;">
        <h1>{{ post_title }}</h1>
        <p>You are now reading the article specifically about <strong>{{ post_title }}</strong>.</p>
        <hr style="width: 50%; border: 1px solid #555;">
{% if current_user.is_authenticated %}
    <div class="mt-4 pt-3 border-top border-secondary d-flex">
        <a href="{{ url_for('update_post', post_id=post.id) }}" class="btn btn-sm btn-outline-info mr-2 px-4">Edit Sermon</a>
        
        <form action="{{ url_for('delete_post', post_id=post.id) }}" method="POST">
            <input type="submit" class="btn btn-sm btn-danger px-3" value="Delete Post" onclick="return confirm('Are you sure?');">
        </form>
    </div>
{% endif %}
    </div>
{% endblock %}
