{% extends "base.html" %}

{% block content %}
<div class="events-section">
    {% if events %}
        {% for event in events %}
            <div class="event-card">
                <h3>{{ event.title }}</h3>
                <p><strong>{{ event.date }}</strong></p>
                <p>{{ event.description }}</p>
            </div>
        {% endfor %}
    {% else %}
        <p style="font-weight: 800; color: black;">No upcoming events scheduled at this time. Check back soon!</p>
    {% endif %}
</div>

<style>
    .events-section {
        padding: 20px;
        color: black;
        margin-top: 40px;
    }
    .event-card {
        margin-bottom: 30px;
    }
    body {
        font-weight: bold;
    }
</style>
{% endblock %}
