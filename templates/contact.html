{% extends "base.html" %}

{% block content %}
<h1 style="color: #39FF14; text-align: center; margin-top: 20px;">Contact Us</h1>

<div class="contact-container">
    
    <div class="contact-info">
        <h2>Visit Us</h2>
        <p><strong>Address:</strong><br>{{ info.address }}</p>
        <p><strong>Phone:</strong><br>{{ info.phone }}</p>
        <p><strong>Office Hours:</strong><br>{{ info.office_hours }}</p>
    </div>

    <div class="map-container">
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.014115112107!2d-122.4194154!3d37.7749295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80859a6d00690021%3A0x4a501367f076adff!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1650000000000!5m2!1sen!2sus" 
            width="100%" 
            height="100%" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy">
        </iframe>
    </div>

</div>
{% endblock %}
