<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>User Database - DEV_HUB</title>
</head>
<body>
    <div class="auth-container" style="width: 600px;">
        <div class="logo-badge">DH</div>
        <h1 class="brand-name">Registered Users</h1>
        
        <table style="width: 100%; margin-top: 20px; color: white; border-collapse: collapse;">
            
        <tr style="border-bottom: 2px solid #334155; text-align: left;">
            <th style="padding: 10px;">ID</th>
            <th style="padding: 10px;">Username</th>
            <th style="padding: 10px;">Password</th> <th style="padding: 10px;">PIN</th>
            <th style="padding: 10px;">Actions</th>
        </tr>
        </thead>
        <tbody>
        {% for user in users %}
        <tr style="border-bottom: 1px solid #334155;">
            <td style="padding: 10px;">{{ user.id }}</td>
            <td style="padding: 10px;">{{ user.username }}</td>
            <td style="padding: 10px;">{{ user.password }}</td> <td style="padding: 10px; color: #38bdf8; font-weight: bold;">{{ user.pin }}</td>
            <td style="padding: 10px;">
                <form action="{{ url_for('delete_user', user_id=user.id) }}" method="POST">
                <button type="submit" class="btn-delete" onclick="return confirm('Delete {{ user.username }}?');">Delete</button>
                </form>
            </td>
        </tr>
    </tbody>
    {% endfor %}
</table>

        <p class="footer-text">
            <a href="{{ url_for('login') }}">← Back to Login</a>
        </p>
    </div>
</body>
</html>
