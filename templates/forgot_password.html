{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <h1>Reset Password</h1>
    <p style="color: #94a3b8; margin-bottom: 20px;">Enter your username to update your password.</p>
    
    <form method="POST">
        <input type="text" name="username" placeholder="Your Username" required>
        <input type="password" name="new_password" placeholder="New Password" required>
        <button type="submit" class="btn-primary">Update Password</button>
    </form><div class="auth-container">
    <h1>Account Recovery</h1>
    <p style="color: #94a3b8; margin-bottom: 20px;">Verify your PIN to set a new password.</p>
    
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="pin" placeholder="Your 4-Digit PIN" required>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
        <input type="password" name="new_password" placeholder="New Password" required>
        
        <button type="submit" class="btn-primary">Reset Password</button>
    </form>
</div>
    
    <p style="margin-top: 20px;">
        <a href="{{ url_for('login') }}" style="color: #38bdf8; text-decoration: none;">← Back to Login</a>
    </p>
</div>
{% endblock %}
