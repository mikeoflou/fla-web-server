{% extends "base.html" %}

{% block content %}
<div style="padding: 20px; max-width: 800px; margin: 0 auto;">
    <h2>Edit Announcement</h2>
    
    {% if announcement %}
    <form method="POST" action="{{ url_for('edit_announcement', ann_id=announcement.id) }}" style="background: #000000; padding: 20px; border: 2px solid #2ecc71; border-radius: 8px;">
        
        <div style="margin-bottom: 15px;">
            <label style="color: #2ecc71;"><strong>Announcement Title:</strong></label><br>
            <input type="text" name="title" value="{{ announcement.title }}" placeholder="Announcement Title" required style="width: 100%; padding: 8px; border: 1px solid #2ecc71; border-radius: 4px; background: #1a1a1a; color: #2ecc71;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="color: #2ecc71;"><strong>Content:</strong></label><br>
            <textarea name="content" placeholder="Announcement Content" required style="width: 100%; height: 200px; padding: 8px; border: 1px solid #2ecc71; border-radius: 4px; background: #1a1a1a; color: #2ecc71; font-family: monospace;">{{ announcement.content or '' }}</textarea>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" style="background: #1f6f3a; color: #ffffff; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Save Changes</button>
            <a href="{{ url_for('announcements') }}" style="margin-left: 10px; color: #2ecc71; text-decoration: none;">← Cancel</a>
        </div>
    </form>
    {% else %}
    <p style="color: #888;">Announcement not found.</p>
    <a href="{{ url_for('announcements') }}" style="color: #2ecc71; text-decoration: none;">← Back to Announcements</a>
    {% endif %}
</div>
{% endblock %}
