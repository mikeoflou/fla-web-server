{% extends "base.html" %}

{% block content %}
<div style="padding: 20px; max-width: 900px; margin: 30px auto;">
    <h2 style="text-align: center;">Manage Page: {{ page_title }}</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div style="background: #102e17; border: 1px solid #2ecc71; border-radius: 6px; padding: 10px; margin-bottom: 15px; color: #b8f5c9;">
                {% for message in messages %}
                    <div>{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('manage_custom_page', slug=page_slug) }}" style="background: #000; border: 2px solid #2ecc71; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
        <div>
            <label><strong>Page Title</strong></label><br>
            <input type="text" name="title" value="{{ page_title }}" required style="width: 100%; padding: 10px; border: 1px solid #2ecc71; border-radius: 5px; background: #000; color: #2ecc71;">
        </div>

        <div>
            <label><strong>Page Content</strong></label><br>
            <textarea name="content" rows="14" style="width: 100%; padding: 10px; border: 1px solid #2ecc71; border-radius: 5px; background: #000; color: #2ecc71; resize: vertical;">{{ page_content }}</textarea>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button type="submit" style="background: #1f6f3a; color: #fff; border: none; border-radius: 6px; padding: 10px 14px; font-weight: bold; cursor: pointer;">Save Page</button>
            <a href="{{ url_for(public_endpoint) }}" style="display: inline-block; background: #222; color: #2ecc71; text-decoration: none; border: 1px solid #2ecc71; border-radius: 6px; padding: 10px 14px; font-weight: bold;">View Public Page</a>
        </div>
    </form>
</div>
{% endblock %}
